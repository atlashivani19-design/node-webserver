
<div class="login-page">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p class="login-subtitle">Authorized administrators only</p>

    <form (ngSubmit)="submit()" #adminForm="ngForm">
      <div class="form-group">
        <label for="adminUsername">Admin Username</label>
        <input
          id="adminUsername"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter admin username"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input
          id="adminPassword"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter admin password"
          autocomplete="current-password"
          required
        />
      </div>

      <button
        type="submit"
        [disabled]="adminForm.invalid || loading">
        {{ loading ? 'Signing in...' : 'Secure Admin Login' }}
      </button>
    </form>

    <p
      *ngIf="message"
      class="login-message"
      [class.error]="error"
      [class.success]="!error"
      role="status"
      aria-live="polite">
      {{ message }}
    </p>
  </div>
</div>
